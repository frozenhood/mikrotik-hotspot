<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="css/style.css">
    <title>Authorization completed</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 2em; }
        .status { font-size: 1.5em; margin-top: 2em; }
    </style>
</head>
<body>
    <h1>Please, wait...</h1>
    <h2>We are waiting for admin's approval</h2>

    <div id="mac-info"></div>

    <div class="status" id="status">Checking internet connection</div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const mac = params.get("mac");

        const macInfo = document.getElementById("mac-info");

        if (mac) {
            macInfo.innerHTML = "<p>Your MAC-address: " + mac + "</p>";
        } else {
            macInfo.innerHTML = "<p>MAC-address not avalible.</p><pre>" + window.location.search + "</pre>";
        }
    </script>

    <script>
        function checkInternet() {
            fetch("https://clients3.google.com/generate_204", { method: 'GET', mode: 'no-cors' })
                .then(() => {
                    document.getElementById("status").textContent = "✅ Internet is available!";
                    setTimeout(() => {
                        if (window.opener) {
                            window.close();
                        } else {
                            window.location.href = "https://google.com";
                            window.close();
                        }
                    }, 2000);
                })
                .catch(() => {
                    setTimeout(checkInternet, 3000);
                });
        }

        checkInternet();
    </script>
</body>
</html>
